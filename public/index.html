<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connect AI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">C</div>

                <div>
                    <div class="brand-title">Connect AI</div>
                    <div class="brand-subtitle">Roblox AI</div>
                </div>
            </div>

            <button id="newChat" class="new-chat">
                + New Chat
            </button>

            <div class="connection">
                <span class="status-dot"></span>
                <span>Connected</span>
            </div>
        </aside>

        <main class="main">

            <header class="header">
                <div>
                    <h1>Connect AI</h1>
                    <p>Chat with your AI from Roblox.</p>
                </div>

                <div id="serverStatus" class="server-status">
                    Checking...
                </div>
            </header>

            <section id="messages" class="messages">

                <div class="welcome">
                    <div class="welcome-icon">✦</div>

                    <h2>How can I help?</h2>

                    <p>
                        Send a message and Connect AI will respond.
                    </p>
                </div>

            </section>

            <form id="chatForm" class="input-area">

                <textarea
                    id="messageInput"
                    placeholder="Message Connect AI..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button
                    id="sendButton"
                    type="submit"
                >
                    Send
                </button>

            </form>

        </main>
    </div>

    <script src="/app.js"></script>
</body>
</html>
